# NGINX reverse proxy: single entry point on port 80, routing by path
# prefix. Requests to /api/* and /media/* go to the FastAPI backend;
# everything else (including Next.js's own /_next/* assets) goes to the
# frontend. Because the browser only ever talks to ONE origin (this
# proxy), the frontend's axios calls to "/api/v1/..." work as same-origin
# requests — no CORS preflight needed for this deployment shape, unlike
# local dev where frontend (:3000) and backend (:8000) are different
# origins (see backend CORSMiddleware, which exists specifically for
# that local-dev case).

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Real client IP forwarding — without these, the backend's rate
    # limiter (core/rate_limit.py, keyed by remote address) would see
    # every request as coming from NGINX's own IP, making the per-client
    # limit meaningless (everyone would share one bucket).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 10M;  # matches the backend's own image-upload cap (see core/images.py)

    location /api/ {
        proxy_pass http://backend_upstream;
    }

    location /media/ {
        proxy_pass http://backend_upstream;
    }

    # WebSocket upgrade headers — without Upgrade/Connection, NGINX
    # proxies this as a plain HTTP request and the notification socket
    # (Phase 6) would fail to connect at all.
    location /api/v1/ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend_upstream;
    }
}
